name: Release

on:
  push:
    tags:
      # Release tags carry no prefix (1.0.0 … 1.0.7); the reusable workflow
      # accepts X.Y.Z with or without a leading "v".
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-sync
      package-name: netresearch/nr-sync
      extension-key: nr_sync
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
