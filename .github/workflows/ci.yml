name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Runs on main, in the merge
# queue and on the schedule are never cancelled. The group sits here in the
# caller, not in the reusable workflow: a caller that invokes ci.yml twice
# would otherwise put both calls in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
        php-versions: '["8.2","8.3","8.4","8.5"]'
        typo3-versions: '["^13.4"]'
        # This extension has no functional tests. Without this the shared
        # workflow runs its functional job, finds no test script, and reports
        # success — coverage that does not exist. See
        # netresearch/typo3-ci-workflows#188.
        run-functional-tests: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
